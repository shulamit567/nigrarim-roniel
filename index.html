<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="השכרת נגררים, עוקבי מים וציוד לשטח. הזמנה מהירה בוואטסאפ או בטלפון."><meta property="og:title" content="נגררים להשכרה – משואות יצחק"><meta property="og:description" content="נגררים, עוקבי מים וציוד לשטח להשכרה. הזמנה בוואטסאפ."><meta name="theme-color" content="#36373b"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><meta property="og:image" content="logo-full.jpg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>השכרת נגררים רוניאל</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&amp;family=Assistant:wght@400;600;700;800&amp;display=swap">
<style id="st">
/* Layout: road-sign hero with a towing animation → running strip of available gear → filterable catalog → contact band. Plate-yellow is the single accent. */
:root{
  --bg:#f5f0ec; --surface:#ffffff; --ink:#2e2f33; --muted:#6e6763; --line:#e3d9d2;
  --plate:#e7dad2; --plate-ink:#36373b; --asphalt:#36373b; --cta-bg:#36373b; --cta-ink:#f1e8e2; --tan:#a8876f; --olive:#55633f; --wa:#1f9d55;
  --danger:#b3261e;
  --f-display:"Karantina","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a19; --surface:#252321; --ink:#efe8e3; --muted:#aaa29d; --line:#3a3633;
  --plate:#e7dad2; --plate-ink:#36373b; --asphalt:#1f1f22; --cta-bg:#e7dad2; --cta-ink:#2e2f33; --tan:#c4a48c; --olive:#9bb07a; --wa:#35c272; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a19; --surface:#252321; --ink:#efe8e3; --muted:#aaa29d; --line:#3a3633;
  --plate:#e7dad2; --plate-ink:#36373b; --asphalt:#1f1f22; --cta-bg:#e7dad2; --cta-ink:#2e2f33; --tan:#c4a48c; --olive:#9bb07a; --wa:#35c272; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
#app{direction:rtl;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.05}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px;line-height:1.1}
.btn-wa{background:var(--wa);color:#fff}
.btn-plate{background:var(--cta-bg);color:var(--cta-ink)}
.hero .btn-plate{background:var(--plate);color:var(--plate-ink)}
.btn-dark{background:var(--plate-ink);color:var(--plate)}
.logo{height:56px;width:auto;border-radius:10px;display:block;flex:none}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:.5px}
.plate{display:inline-flex;align-items:center;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:5px;padding:1px 8px;font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

/* hero */
.hero{background-color:var(--asphalt);background-image:linear-gradient(180deg,rgba(16,19,22,.82) 0%,rgba(16,19,22,.55) 38%,rgba(16,19,22,.08) 72%,rgba(16,19,22,0) 100%),url(hero.jpg);background-size:cover;background-position:center 72%;background-repeat:no-repeat;color:#f4f4ef;border-radius:18px;overflow:hidden;position:relative;display:grid;grid-template-columns:1fr;}
.hero-text{padding:28px 24px 0;display:grid;gap:10px}
.hero h1{text-shadow:0 2px 18px rgba(0,0,0,.45);font-family:var(--f-display);font-weight:700;font-size:clamp(54px,9vw,104px);letter-spacing:.5px}
.hero h1 em{font-style:normal;color:var(--plate)}
.hero p{margin:0;max-width:52ch;color:#e6e8e9;font-size:18px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .btn-ghost{color:#f4f4ef;border-color:#5a6066}
.scene{position:relative;height:clamp(120px,24vw,250px);margin-top:28px}
.veh{position:absolute;bottom:7%;left:50%;width:clamp(250px,62%,600px);max-width:92%;height:auto;transform:translateX(-50%);filter:drop-shadow(0 10px 8px rgba(0,0,0,.45));animation:drive 2.8s cubic-bezier(.2,.7,.25,1) both}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear 6}
.dash{animation:road 2.8s cubic-bezier(.2,.7,.25,1) both}
.dust{transform-box:fill-box;transform-origin:center;animation:dust 2.8s ease-out both}
@keyframes drive{from{transform:translateX(calc(-50% + 80vw))}to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(-360deg)}}
@keyframes road{from{transform:translateX(0)}to{transform:translateX(-240px)}}
@keyframes dust{0%{opacity:.7;transform:scale(.4)}80%{opacity:.35}100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.veh,.wheel,.dash,.dust,.track{animation:none!important}.dust{opacity:0}}

/* sections */
section{margin-top:44px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-family:var(--f-display);font-size:clamp(40px,5vw,56px);font-weight:700}
.sec-head p{margin:0;color:var(--muted)}

/* running strip */
.strip{overflow:hidden;border-block:3px solid var(--ink);padding-block:14px;position:relative}
.track{display:flex;gap:14px;width:max-content;animation:run 40s linear infinite}
.strip:hover .track,.strip:focus-within .track{animation-play-state:paused}
@keyframes run{to{transform:translateX(50%)}}
.tile{width:240px;flex:none;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:pointer;padding:0;text-align:right;display:grid}
.tile .ph{aspect-ratio:4/3}
.tile .cap{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tile .cap b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cap span{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}

.ph{width:100%;max-width:100%;background:color-mix(in srgb,var(--plate) 45%,var(--surface));display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:78%;height:auto;color:var(--ink)}

/* filters + grid */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:right;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(0,0,0,.45)}
.card .ph{aspect-ratio:16/11}
.card .body{padding:14px 16px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.card h3{font-size:21px;font-weight:800}
.card .desc{color:var(--muted);font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.price{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.price small{font-weight:600;color:var(--muted);font-size:14px}
.tag{font-size:12px;font-weight:800;border-radius:4px;padding:2px 7px;letter-spacing:.3px}
.tag-out{background:var(--danger);color:#fff}
.tag-ex{border:1px dashed var(--muted);color:var(--muted)}
.unavail .ph{filter:grayscale(1);opacity:.6}
.empty{padding:28px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

/* contact band */
.contact{background:var(--plate);color:var(--plate-ink);border-radius:18px;padding:26px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.contact h2{font-family:var(--f-display);font-size:clamp(40px,5vw,58px)}
.contact .num{font-size:26px;font-weight:800;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.contact .btn-ghost{color:var(--plate-ink);border-color:var(--plate-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer{margin-top:32px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px);direction:rtl}
dialog::backdrop{background:rgba(10,12,14,.6)}
.dlg{display:grid;grid-template-columns:1fr;}
.dlg .ph{aspect-ratio:16/10}
.dlg-body{padding:20px 22px 22px;display:grid;gap:14px;min-width:0}
.dlg-body h3{font-family:var(--f-display);font-size:46px;font-weight:700}
.x{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2}
.specs{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.specs li{display:flex;gap:8px;align-items:baseline}
.specs li::before{content:"";width:8px;height:8px;background:var(--plate);border:1.5px solid var(--ink);flex:none;transform:translateY(-1px)}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:14px}
.form .full{grid-column:1/-1}
.form h4{margin:0;font-size:17px}
label{display:grid;gap:4px;font-weight:600;font-size:14px;min-width:0}
input,select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.note{font-size:13px;color:var(--muted);margin:0}
.callbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.callbox .num{font-weight:800;font-size:20px;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
@media (max-width:560px){.form{grid-template-columns:1fr}.hero-text{padding:22px 18px 0}}

/* admin */
.admin-bar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;z-index:5}
.adm{padding:20px 22px;display:grid;gap:16px}
.adm h3{font-family:var(--f-display);font-size:42px}
.adm-list{display:grid;gap:8px}
.adm-item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px}
.adm-item .ph{width:64px;aspect-ratio:1;border-radius:6px}
.adm-item b{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-item small{color:var(--muted)}
.adm-item .row{gap:6px}
.sm{padding:7px 12px;font-size:14px}
.status{font-weight:700;font-size:14px}
.status.err{color:var(--danger)}
.status.ok{color:var(--wa)}
fieldset{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:0}
fieldset legend{font-weight:800;padding-inline:6px}
fieldset .full{grid-column:1/-1}
@media (max-width:560px){fieldset{grid-template-columns:1fr}}
.sticky-save{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
<script>window.STATIC_SITE=true</script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.png" alt="לוגו השכרת נגררים וציוד לשטח"><span id="brandName"></span></div>
    <div class="top-actions">
      <a class="btn btn-wa sm js-wa" target="_blank" rel="noopener"></a>
      <a class="btn btn-ghost sm js-call"></a>
    </div>
  </header>

  <div class="hero">
    <div class="hero-text">
      <h1>נגרר לכל <em>יציאה</em> לדרך</h1>
      <p id="heroSub">נגררים, עוקבי מים וציוד לשטח להשכרה יומית. בוחרים מה שצריך, שולחים הודעה, ואנחנו מתאמים איסוף.</p>
      <div class="hero-cta">
        <a class="btn btn-plate" href="#catalog">לכל הציוד</a>
        <a class="btn btn-wa js-wa" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="scene" role="img" aria-label="רכב גורר נגרר"><img class="veh" src="vehicle.png" alt=""></div>
  </div>

  <section aria-labelledby="h-avail">
    <div class="sec-head"><h2 id="h-avail">זמין עכשיו</h2><p>לחצו על פריט כדי להזמין</p></div>
    <div class="strip"><div class="track" id="track"></div></div>
  </section>

  <section id="catalog" aria-labelledby="h-cat">
    <div class="sec-head"><h2 id="h-cat">כל הציוד להשכרה</h2><div class="filters" id="filters"></div></div>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <div class="contact">
      <div style="display:grid;gap:6px;min-width:0">
        <h2>מדברים עם <span class="js-owner"></span></h2>
        <div class="num js-num"></div>
      </div>
      <div class="row">
        <a class="btn btn-wa js-wa" target="_blank" rel="noopener"></a>
        <a class="btn btn-dark js-call-owner"></a>
      </div>
    </div>
  </section>

  <footer><span id="foot"></span><button class="linkbtn" id="adminLink" type="button" hidden="">ניהול האתר</button></footer>

  <dialog id="pdlg" aria-labelledby="pd-title"></dialog>
  <dialog id="adlg" aria-labelledby="ad-title"></dialog>
  <div class="admin-bar" id="adminBar" hidden=""><button class="btn btn-plate" id="adminOpen" type="button">✎ ניהול מוצרים</button></div>

const defaultIllus = c => c==="water"?"tank":c==="gear"?"gear":"box";
const ph = p => '<div class="ph">'+(p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">':(ILLUS[p.illus||defaultIllus(p.cat)]||ILLUS.box))+'</div>';
const plateCode = id => { let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; const n=String(h%100000000).padStart(8,"0"); return n.slice(0,2)+"-"+n.slice(2,5)+"-"+n.slice(5); };

function intlNum(){ const d=(S.settings.phone||"").replace(/\D/g,""); return d.startsWith("0")?"972"+d.slice(1):d; }
function waLink(text){ return "https://wa.me/"+intlNum()+"?text="+encodeURIComponent(text); }
function genericMsg(){ return "היי "+S.settings.owner+", הגעתי מהאתר של "+S.settings.business+" ואשמח לשמוע על השכרת ציוד."; }
function productMsg(p,f){
  let t = "היי "+S.settings.owner+", ראיתי באתר את \""+p.name+"\" ("+p.price+" ₪ "+p.unit+") ואשמח לשכור.";
  if(f){
    if(f.from) t += "\nתאריכים: "+f.from+(f.to&&f.to!==f.from?" עד "+f.to:"");
    if(f.name) t += "\nשם: "+f.name;
    if(f.phone) t += "\nטלפון: "+f.phone;
    if(f.notes) t += "\nהערות: "+f.notes;
  }
  return t;
}
async function copyNum(btn){
  const n=S.settings.phone;
  try{ await navigator.clipboard.writeText(n); btn.textContent="הועתק ✓"; }
  catch(e){ const el=document.querySelector(".js-num"); const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent="המספר מסומן, העתיקו אותו"; }
  setTimeout(()=>btn.textContent="העתק מספר",2500);
}

function render(){
  const st=S.settings;
  $("#brandName").textContent=st.business;
  $("#foot").textContent=st.business+" · "+(st.area?st.area+" · ":"")+"השכרת נגררים וציוד לשטח";
  document.querySelectorAll(".js-owner").forEach(e=>e.textContent=st.owner);
  document.querySelectorAll(".js-num").forEach(e=>e.textContent=st.phone);
  document.querySelectorAll(".js-wa").forEach(a=>{a.href=waLink(genericMsg()); a.innerHTML=ICON_WA+"<span>וואטסאפ ל"+esc(st.owner)+"</span>";});
  document.querySelectorAll(".js-call").forEach(a=>{a.href="tel:"+st.phone.replace(/[^\d+]/g,""); a.innerHTML=ICON_PHONE+'<span style="direction:ltr;unicode-bidi:isolate">'+esc(st.phone)+"</span>";});
  document.querySelectorAll(".js-call-owner").forEach(a=>{a.href="tel:"+st.phone.replace(/[^\d+]/g,""); a.innerHTML=ICON_PHONE+"<span>התקשרו ל"+esc(st.owner)+"</span>";});

  const av=S.products.filter(p=>p.avail);
  const tiles=av.map(p=>'<button class="tile" type="button" data-id="'+p.id+'">'+ph(p)+'<div class="cap"><b>'+esc(p.name)+'</b><span>'+p.price+' ₪</span></div></button>').join("");
  const reps = av.length? Math.max(1,Math.ceil(6/av.length)):0;
  const half = tiles.repeat(reps);
  $("#track").innerHTML = av.length? half+half.replace(/<button /g,'<button tabindex="-1" aria-hidden="true" ') : '<p class="empty" style="margin:0;width:100%">כרגע אין פריטים זמינים</p>';
  $("#track").style.animationDuration=(Math.max(av.length*reps,4)*6)+"s";

  $("#filters").innerHTML=CATS.map(([k,v])=>'<button class="chip" type="button" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+v+'</button>').join("");
  const list=S.products.filter(p=>filter==="all"||p.cat===filter);
  $("#grid").innerHTML = list.length? list.map(p=>'<button class="card'+(p.avail?"":" unavail")+'" type="button" data-id="'+p.id+'">'+ph(p)+'<div class="body"><div class="row" style="justify-content:space-between">'+(p.avail?(p.example?'<span class="tag tag-ex">דוגמה</span>':''):'<span class="tag tag-out">מושכר כרגע</span>')+'</div><h3>'+esc(p.name)+'</h3><p class="desc">'+esc(p.desc)+'</p><div class="meta"><span class="price">'+p.price+' ₪ <small>'+esc(p.unit)+'</small></span><span class="btn btn-plate sm">להזמנה</span></div></div></button>').join("") : '<p class="empty">אין עדיין פריטים בקטגוריה הזו</p>';
}

   '<div class="callbox">'+ICON_PHONE.replace('<svg','<svg width="20" height="20"')+'<span>להתקשר ישירות:</span><a class="num" href="tel:'+esc(S.settings.phone.replace(/[^\d+]/g,""))+'">'+esc(S.settings.phone)+'</a></div>'+
   '<form class="form" id="lead"><h4 class="full">השאירו פרטים וההודעה תישלח בוואטסאפ</h4>'+
   '<label>שם<input id="l-name" required autocomplete="name"></label><label>טלפון<input id="l-phone" type="tel" required autocomplete="tel" dir="ltr"></label>'+
   '<label>מתאריך<input id="l-from" type="date" min="'+today+'"></label><label>עד תאריך<input id="l-to" type="date" min="'+today+'"></label>'+
   '<label class="full">הערות<textarea id="l-notes" placeholder="למשל: שעת איסוף, למה צריך את הציוד"></textarea></label>'+

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-id]"); if(t && !e.target.closest("dialog#adlg")){ openProduct(t.dataset.id); return; }
  const f=e.target.closest("[data-f]"); if(f){ filter=f.dataset.f; render(); return; }
  if(e.target.closest("[data-close]")) e.target.closest("dialog").close();
  const c=e.target.closest(".js-copy"); if(c) copyNum(c);
});
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{ if(e.target===d) d.close(); }));

let artifactNS=null, dirty=false, editing=null;
function buildDoc(){
  const json=JSON.stringify(S).replace(/</g,"\\u003c");
  return SKEL_OPEN+PRISTINE.head+'\n'+PRISTINE.app+'\n\n<script type="application/json" id="state">'+json+'<\/script><script>'+SRC+'<\/script></body></html>';
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{ const M=1100; let w=im.width,h=im.height; if(Math.max(w,h)>M){ const k=M/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k);} const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h); res(c.toDataURL("image/jpeg",0.78)); }; im.onerror=()=>rej(new Error("img")); im.src=r.result; };
    r.onerror=()=>rej(r.error); r.readAsDataURL(file);
  });
}

  const st=S.settings;
  const p=editing? S.products.find(x=>x.id===editing) : null;
  const v=p||{name:"",cat:"trailer",price:"",unit:"ליום",desc:"",specs:"",img:"",avail:true};

  '<label class="full">שם המוצר<input id="p-name" value="'+esc(v.name)+'" placeholder="למשל: נגרר סגור 3 מ׳"></label>'+
  '<label>קטגוריה<select id="p-cat">'+CATS.slice(1).map(([k,n])=>'<option value="'+k+'"'+(v.cat===k?" selected":"")+'>'+n+'</option>').join("")+'</select></label>'+
  '<label>מחיר (₪)<input id="p-price" type="number" min="0" inputmode="numeric" value="'+esc(v.price)+'"></label>'+
  '<label>יחידת מחיר<input id="p-unit" value="'+esc(v.unit)+'" placeholder="ליום / לסופ״ש"></label>'+
  '<label>תמונה<input id="p-img" type="file" accept="image/*"></label>'+
  '<label class="full">תיאור<textarea id="p-desc">'+esc(v.desc)+'</textarea></label>'+
  '<label class="full">מפרט (שורה לכל פרט)<textarea id="p-specs">'+esc(v.specs)+'</textarea></label>'+
  '<label class="full" style="display:flex;gap:8px;align-items:center"><input id="p-avail" type="checkbox" style="width:auto"'+(v.avail?" checked":"")+'> זמין להשכרה עכשיו</label>'+
  '<div class="full row"><button class="btn btn-plate sm" type="button" id="p-save">'+(p?"עדכון המוצר":"הוספה לרשימה")+'</button>'+(p?'<button class="btn btn-ghost sm" type="button" id="p-cancel">ביטול עריכה</button>':'')+'<span class="status" id="p-status"></span></div></fieldset>'+
  '<div><b>המוצרים באתר ('+S.products.length+')</b><div class="adm-list" style="margin-top:8px">'+S.products.map(x=>'<div class="adm-item">'+ph(x)+'<div style="min-width:0"><b>'+esc(x.name)+'</b><small>'+catName(x.cat)+' · '+x.price+' ₪ · '+(x.avail?"זמין":"מושכר")+(x.example?" · דוגמה":"")+'</small></div><div class="row"><button class="btn btn-ghost sm" type="button" data-act="toggle" data-pid="'+x.id+'">'+(x.avail?"סמן כמושכר":"סמן כזמין")+'</button><button class="btn btn-ghost sm" type="button" data-act="edit" data-pid="'+x.id+'">עריכה</button><button class="btn btn-ghost sm" type="button" data-act="del" data-pid="'+x.id+'">'+(x._confirm?"בטוח? מחיקה":"מחיקה")+'</button></div></div>').join("")+'</div></div>'+
  '</div><div class="sticky-save"><button class="btn btn-wa" type="button" id="publish">שמירה ופרסום באתר</button><span class="status" id="pub-status">'+(dirty?"יש שינויים שעוד לא פורסמו":"")+'</span></div>';
}
function readSettings(){
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():null;};
  const b=g("s-business"); if(b===null) return;
  const n={business:b||S.settings.business,owner:g("s-owner")||S.settings.owner,phone:g("s-phone")||S.settings.phone,area:g("s-area")};
  if(JSON.stringify(n)!==JSON.stringify(S.settings)){ S.settings=n; dirty=true; }
}
function drawAdmin(keepScroll){
  const d=$("#adlg"); const sc=d.scrollTop; d.innerHTML=adminHTML(); if(keepScroll) d.scrollTop=sc; render();
}
function openAdmin(){ editing=null; drawAdmin(); $("#adlg").showModal(); }
$("#adlg").addEventListener("change",e=>{ if(e.target.id&&e.target.id.startsWith("s-")){ readSettings(); render(); const s=$("#pub-status"); if(s) s.textContent="יש שינויים שעוד לא פורסמו"; }});
$("#adlg").addEventListener("click",async e=>{
  const btn=e.target.closest("button"); if(!btn) return;
  if(btn.id==="p-cancel"){ editing=null; drawAdmin(true); return; }
  if(btn.dataset.act){
    readSettings();
    const x=S.products.find(p=>p.id===btn.dataset.pid); if(!x) return;
    if(btn.dataset.act==="toggle"){ x.avail=!x.avail; dirty=true; }
    if(btn.dataset.act==="edit"){ editing=x.id; drawAdmin(); $("#pform").scrollIntoView({block:"start"}); return; }
    if(btn.dataset.act==="del"){ if(x._confirm){ S.products=S.products.filter(p=>p!==x); dirty=true; if(editing===x.id) editing=null; } else { x._confirm=true; setTimeout(()=>{x._confirm=false;},4000);} }
    drawAdmin(true); return;
  }
  if(btn.id==="p-save"){
    readSettings();
    const status=$("#p-status"); const name=$("#p-name").value.trim(); const price=Number($("#p-price").value);
    if(!name){ status.className="status err"; status.textContent="צריך למלא שם מוצר"; return; }
    if(!(price>=0) || $("#p-price").value===""){ status.className="status err"; status.textContent="צריך למלא מחיר במספרים"; return; }
    let target=editing? S.products.find(p=>p.id===editing) : null;
    const file=$("#p-img").files[0]; let img=target?target.img:"";
    if(file){ status.className="status"; status.textContent="מכין את התמונה…"; try{ img=await resizeImage(file);}catch(err){ status.className="status err"; status.textContent="לא הצלחנו לקרוא את התמונה. נסו קובץ JPG או PNG."; return; } }
    const data={name,cat:$("#p-cat").value,price,unit:$("#p-unit").value.trim()||"ליום",desc:$("#p-desc").value.trim(),specs:$("#p-specs").value.trim(),img,avail:$("#p-avail").checked};
    if(target){ Object.assign(target,data); target.example=false; }
    else S.products.unshift(Object.assign({id:"p"+Date.now().toString(36)},data));
    dirty=true; editing=null; drawAdmin(); const s2=$("#p-status"); if(s2){ s2.className="status ok"; s2.textContent=target?"המוצר עודכן. לחצו על שמירה ופרסום.":"המוצר נוסף. לחצו על שמירה ופרסום."; }
    return;
  }
  if(btn.id==="publish"){
    readSettings();
    const s=$("#pub-status");
    S.products.forEach(p=>delete p._confirm);
    if(!artifactNS){ s.className="status err"; s.textContent="אי אפשר לשמור מהתצוגה הזו. פתחו את האתר מתוך חשבון Claude שלכם."; return; }
    const html=buildDoc();
    if(html.length>15.5e6){ s.className="status err"; s.textContent="האתר גדול מדי. מחקו כמה תמונות או החליפו בתמונות קטנות יותר."; return; }
    btn.disabled=true; s.className="status"; s.textContent="מפרסם…";
    try{ await artifactNS.publish(html); s.className="status ok"; s.textContent="פורסם! האתר מתעדכן."; dirty=false; }
    catch(err){
      btn.disabled=false; s.className="status err";
      const c=err&&err.code;
      s.textContent = c==="conflict"?"מישהו אחר שמר שינוי באותו זמן. האתר נטען מחדש, בצעו את השינוי שוב.":
        (c==="not_writer"||c==="not_granted"||c==="capability_disabled"||c==="not_declared")?"לחשבון הזה אין הרשאה לערוך את האתר.":
        c==="too_large"?"האתר גדול מדי. מחקו כמה תמונות.":c==="rate_limited"?"נשמר הרבה בזמן קצר. חכו דקה ונסו שוב.":"השמירה נכשלה. נסו שוב בעוד רגע.";
    }
  }
});

(async()=>{
  try{
    if(window.STATIC_SITE) return;
    if(!window.claude||!claude.use) { if(location.hash==="#admin"){ $("#adminLink").hidden=false; } return; }
    const [u,a]=await Promise.all([claude.use("user").catch(()=>null),claude.use("artifact").catch(()=>null)]);

    let can=false; try{ can = u ? await u.canEdit() : false; }catch(e){}
    if(can && a){ $("#adminBar").hidden=false; $("#adminLink").hidden=false; }
